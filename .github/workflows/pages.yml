name: Pages

# Scans prices once a day and publishes the web page to GitHub Pages.
# Every scan is kept as a small file in data/scans on main; the database is
# rebuilt from those files on each run.

on:
  schedule:
    - cron: "0 5 * * *" # every day at 05:00 UTC
  workflow_dispatch:
    inputs:
      scan:
        description: Scan prices before publishing
        type: boolean
        default: true
  push:
    branches: [main] # republish page changes and locally made scans

permissions:
  contents: write # commit new scans to main
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so the scan commit can rebase onto main

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o pmscanner .

      - name: Scan
        id: scan
        if: >-
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.scan) ||
          hashFiles('data/scans/*.json.gz') == ''
        run: ./pmscanner -db "$RUNNER_TEMP/pmscanner.db" -history data/scans > scan.txt

      - name: Show failures
        if: steps.scan.outcome != 'skipped'
        run: grep 'error:' scan.txt || echo "no failures"

      - name: Commit the scan
        if: steps.scan.outcome == 'success'
        run: |
          git add data/scans
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Add scanned prices" || exit 0
          git pull -q --rebase origin main
          git push -q origin HEAD:main

      - name: Export the page
        run: ./pmscanner -db "$RUNNER_TEMP/pmscanner.db" -history data/scans -export site

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
